substitutions:
  _JOB_NAME: gcp-training
  _REGION: europe-west1

steps:
# 1️⃣ Build image
- id: 'Build image'
  name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/gcp-training', '-f','gcp_training/Dockerfile','.']

# 2️⃣ Push image
- id: 'Push image'
  name: 'gcr.io/cloud-builders/docker'
  args:
    - 'push'
    - 'gcr.io/$PROJECT_ID/${_JOB_NAME}'

# 3️⃣ Create OR update job
- id: 'Deploy Job'
  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
    - '-c'
    - |
      if gcloud run jobs describe ${_JOB_NAME} --region ${_REGION} >/dev/null 2>&1; then
        echo "Job exists. Updating..."
        gcloud run jobs update ${_JOB_NAME} \
          --image gcr.io/$PROJECT_ID/${_JOB_NAME} \
          --region ${_REGION}
      else
        echo "Job does not exist. Creating..."
        gcloud run jobs create ${_JOB_NAME} \
          --image gcr.io/$PROJECT_ID/${_JOB_NAME} \
          --region ${_REGION}
      fi

# 4️⃣ (Optional) Execute job immediately
- id: 'Run Job'
  name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'jobs'
    - 'execute'
    - '${_JOB_NAME}'
    - '--region'
    - '${_REGION}'

images:
  - gcr.io/$PROJECT_ID/${_JOB_NAME}

options:
  logging: CLOUD_LOGGING_ONLY